name: EMPLOIDB CI/CD Pipeline

on:
  push:
    branches: [ main, nextgen/saas-refactor ]
  pull_request:
    branches: [ main, nextgen/saas-refactor ]

env:
  PHP_VERSION: '8.1'
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.10'

jobs:
  # =============================================================================
  # PHP LINTING AND TESTING
  # =============================================================================
  php-lint:
    runs-on: ubuntu-latest
    name: PHP Linting
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, curl, json, zip
        coverage: xdebug
        
    - name: Install dependencies
      run: |
        composer install --no-dev --optimize-autoloader
        
    - name: Run PHP Lint
      run: |
        find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -exec php -l {} \;
        
    - name: Run PHP CS Fixer
      run: |
        composer require --dev friendsofphp/php-cs-fixer
        ./vendor/bin/php-cs-fixer fix --dry-run --diff

  # =============================================================================
  # PYTHON SERVICES TESTING
  # =============================================================================
  python-services:
    runs-on: ubuntu-latest
    name: Python Services Testing
    strategy:
      matrix:
        service: [service-ai, service-logo]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        cd services/${{ matrix.service }}
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Run Python Lint
      run: |
        cd services/${{ matrix.service }}
        pip install flake8 black
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check .
        
    - name: Run Python Tests
      run: |
        cd services/${{ matrix.service }}
        pytest tests/ -v

  # =============================================================================
  # DATABASE MIGRATION TESTING
  # =============================================================================
  database-migrations:
    runs-on: ubuntu-latest
    name: Database Migrations Testing
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: emploi_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql
        
    - name: Wait for MySQL
      run: |
        while ! mysqladmin ping -h"127.0.0.1" -P3306 -uroot -proot --silent; do
          sleep 1
        done
        
    - name: Run Database Migrations
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -proot emploi_test < database/migrations/001_multi_tenant_schema.sql
        mysql -h 127.0.0.1 -P 3306 -u root -proot emploi_test < database/migrations/002_job_aggregation_tables.sql
        
    - name: Verify Migration Success
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -proot emploi_test -e "SHOW TABLES;"

  # =============================================================================
  # SECURITY SCANNING
  # =============================================================================
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # BUILD AND TEST CONTAINERS
  # =============================================================================
  build-containers:
    runs-on: ubuntu-latest
    name: Build Containers
    strategy:
      matrix:
        service: [service-ai, service-logo]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        cd services/${{ matrix.service }}
        docker build -t emploidb-${{ matrix.service }}:latest .
        
    - name: Test Docker image
      run: |
        cd services/${{ matrix.service }}
        docker run --rm -d -p 8001:8001 --name test-container emploidb-${{ matrix.service }}:latest
        sleep 10
        curl -f http://localhost:8001/health || exit 1
        docker stop test-container

  # =============================================================================
  # INTEGRATION TESTS
  # =============================================================================
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [php-lint, python-services, database-migrations]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: emploi_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: --health-cmd="rabbitmq-diagnostics -q ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, curl, json, zip
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install PHP dependencies
      run: composer install --no-dev --optimize-autoloader
      
    - name: Install Python dependencies
      run: |
        cd services/service-ai
        pip install -r requirements.txt
        cd ../service-logo
        pip install -r requirements.txt
        
    - name: Setup test database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -proot emploi_test < database/migrations/001_multi_tenant_schema.sql
        mysql -h 127.0.0.1 -P 3306 -u root -proot emploi_test < database/migrations/002_job_aggregation_tables.sql
        
    - name: Start AI Service
      run: |
        cd services/service-ai
        python app.py &
        sleep 5
        
    - name: Start Logo Service
      run: |
        cd services/service-logo
        python app.py &
        sleep 5
        
    - name: Run Integration Tests
      run: |
        # Test AI service health
        curl -f http://localhost:8001/health || exit 1
        
        # Test Logo service health
        curl -f http://localhost:8002/health || exit 1
        
        # Test job aggregator
        php services/service-jobs/job_aggregator.php

  # =============================================================================
  # DEPLOYMENT (Only on main branch)
  # =============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: [php-lint, python-services, database-migrations, security-scan, build-containers, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # This could include:
        # - Building and pushing Docker images
        # - Running database migrations
        # - Updating Kubernetes manifests
        # - Restarting services
        
    - name: Notify deployment success
      run: |
        echo "Deployment to staging completed successfully!"

  # =============================================================================
  # CLEANUP
  # =============================================================================
  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup
    needs: [deploy]
    if: always()
    
    steps:
    - name: Cleanup resources
      run: |
        echo "Cleaning up temporary resources..."
        # Add cleanup commands here
